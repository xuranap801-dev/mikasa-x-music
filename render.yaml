services:
  - type: web
    name: mikasa-x-music
    env: python
    region: oregon
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install -r requirements.txt
    startCommand: python3 -m ShrutiMusic
    autoDeploy: true

    envVars:
      API_ID: 
        sync: false
      API_HASH: 
        sync: false
      API_KEY:
        sync: false
      BOT_TOKEN:
        sync: false
      MONGO_DB_URI: 
        sync: false
      OWNER_ID:
        sync: false
      OWNER_USERNAME:
        sync: false
      BOT_USERNAME:
        sync: false
      UPSTREAM_REPO:
        sync: false
      STRING_SESSION:
        sync: false
      GIT_TOKEN:
        sync: false
      HEROKU_API_KEY:
        sync: false
      HEROKU_APP_NAME:
        sync: false
      LOG_GROUP_ID:
        sync: false
      SUPPORT_GROUP:
        sync: false
      SUPPORT_CHANNEL:
        sync: false
      INSTAGRAM:
        sync: false
      YOUTUBE:
        sync: false
      GITHUB:
        sync: false
      DONATE:
        sync: false/91
      START_IMG_URL:
        sync: false
